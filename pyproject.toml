[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsclc-metastasis"
version = "1.0.0"
description = "Leakage-corrected multi-omics (TCGA LUAD/LUSC) stacked ensemble for NSCLC metastasis prediction — research reproduction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Akshay Karthik" }]
keywords = ["NSCLC", "TCGA", "multi-omics", "autoencoder", "stacking", "machine learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12",
  "tensorflow-cpu>=2.16",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nsclc-metastasis = "nsclc_metastasis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
